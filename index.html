<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Your favourite music is here!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <nav>
        <ul>
            <li class="brand"><img src="images/Spotify_App_Logo.svg.webp" class="transparent-image"
                    alt="Spotify">My Spotify🎶</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="container">

        <div class="songlist">
            <h1>Best of My Era 🤍✨</h1>
            <div>
                <div class="songItem">
                    <img src="images/tum_cover.jpg" alt="">
                    <span class="songName">Tum Prem Ho🦚🪷 </span>
                    <span class="songListPlay">
                        <span class="timestamp"> 05:03 <i id="0"   class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
                <div class="songItem">
                    <img src="images/kadam-cover.avif" alt="">
                    <span class="songName">Char Kadam💏 </span>
                    <span class="songListPlay">
                        <span class="timestamp"> 04:02 <i   id="1" class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
                <div class="songItem">
                    <img src="images/hona-tha-cover.jpg" alt="">
                    <span class="songName">Hona Tha Pyaar💕 </span>
                    <span class="songListPlay">
                        <span class="timestamp"> 03:42 <i   id="2" class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
                <div class="songItem">
                    <img src="images/pal cover.jpg" alt="">
                    <span class="songName">Pal Pal🔥</span>
                    <span class="songListPlay">
                        <span class="timestamp"> 02:27 <i   id="3" class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
                <div class="songItem">
                    <img src="images/talibaani-cover.jpg" alt="">
                    <span class="songName">Ankh Ye Talibaani👀</span>
                    <span class="songListPlay">
                        <span class="timestamp"> 02:52 <i  id="4"  class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
                <div class="songItem">
                    <img src="images/casa-cover.jpg" alt="">
                    <span class="songName">Casa Casa🍾</span>
                    <span class="songListPlay">
                        <span class="timestamp"> 03:03 <i   id="5" class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div> 
                 <div class="songItem">
                    <img src="images/banger-cover.jpg" alt="">
                    <span class="songName">Banger 🪩</span>
                    <span class="songListPlay">
                        <span class="timestamp"> 02:45 <i   id="6" class="fa-solid songItemPlay fa-1x fa-circle-play"></i> </span>

                    </span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" value="0" min="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->
            <i class="fa-solid fa-2x fa-backward-step"></i>
            <i class="fa-solid fa-2x fa-backward"></i>
            <i class="fa-solid fa-2x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-2x fa-forward"></i>
            <i class="fa-solid fa-2x fa-forward-step"></i>

        </div>
        <div class="songInfo">
            <img src="images/playing.gif" width = 110px alt="" id = "gif">
            <span class="masterSongName">Tum Prem Ho🦚🪷</span> 
        </div>
    </div>




    <script src="app.js"></script>
</body>

</html>
